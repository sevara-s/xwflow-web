<!DOCTYPE html>
<html
  lang="en"
  data-theme="xwflow-neon"
  data-brand="xwflow"
  data-style="modern"
  data-accent="xwflow"
  data-roundness="pill"
  data-font="xwflow"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="/theme/xwflow/brand.css" />
    <link rel="stylesheet" href="https://xwui.dev/styles/style/modern/spacing.css" />

    <link rel="stylesheet" href="https://xwui.dev/styles/theme/icons/heroicons.css" />
    <link rel="stylesheet" href="https://xwui.dev/styles/theme/icons_colors/default.css" />
    <link rel="stylesheet" href="https://xwui.dev/styles/theme/emojis/apple.css" />

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
